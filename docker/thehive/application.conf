# =========================================================
# THEHIVE CONFIGURATION
# SOC-IAC PLATFORM
# =========================================================

# =========================================================
# PLAY FRAMEWORK
# =========================================================

play.http.secret.key="soc-iac-secret-key"

# =========================================================
# APPLICATION
# =========================================================

application.baseUrl="http://localhost:9000"

# =========================================================
# HTTP SERVER
# =========================================================

http.port=9000

# =========================================================
# DATABASE
# =========================================================

db.janusgraph {
  storage {
    backend = cql
    hostname = ["cassandra"]

    cql {
      cluster-name = thp
      keyspace = thehive
    }
  }
}

# =========================================================
# INDEX SEARCH
# =========================================================

index.search {
  backend=elasticsearch
  hostname=["http://elasticsearch:9200"]
  index-name=thehive
}

# =========================================================
# STORAGE
# =========================================================

storage {
  provider = localfs
  localfs.location = "/opt/thp/thehive/files"
}

# =========================================================
# AUTHENTICATION
# =========================================================

auth {
  providers: [
    {
      name: local
      provider: local
    }
  ]
}

# =========================================================
# CORTEX
# =========================================================

play.modules.enabled += org.thp.thehive.connector.cortex.CortexModule

cortex {
  servers = [
    {
      name = "local-cortex"
      url = "http://cortex:9001"
      auth {
        type = "bearer"
        key = "changeme"
      }
      version = 3
    }
  ]
}

# =========================================================
# LOGGING
# =========================================================

logger.application=INFO
logger.play=INFO
logger.org.thp=INFO

# =========================================================
# JOBS
# =========================================================

jobs.enabled=true

# =========================================================
# STREAM
# =========================================================

stream.longpolling.timeout="1 minute"

# =========================================================
# FILES
# =========================================================

attachment.maximumSize=100MB

# =========================================================
# ALERTS
# =========================================================

alert.autoCreateCase=true

# =========================================================
# ORGANIZATION
# =========================================================

organization.name="SOC-IAC"

# =========================================================
# SECURITY
# =========================================================

security {
  password {
    minLength = 8
  }
}

# =========================================================
# TIMEZONE
# =========================================================

play.i18n.langs = [ "en" ]
