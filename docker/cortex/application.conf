# =========================================================
# CORTEX CONFIGURATION
# SOC-IAC PLATFORM
# =========================================================

# =========================================================
# HTTP SERVER
# =========================================================

http.address=0.0.0.0
http.port=9001

# =========================================================
# APPLICATION
# =========================================================

play.http.secret.key="soc-iac-cortex-secret"

# =========================================================
# ORGANIZATION
# =========================================================

organization.name="SOC-IAC"

# =========================================================
# JOB DIRECTORY
# =========================================================

job.directory="/tmp/cortex-jobs"

# =========================================================
# ANAYLZERS
# =========================================================

analyzer.urls = [
  "https://download.thehive-project.org/analyzers.json"
]

# =========================================================
# RESPONDERS
# =========================================================

responder.urls = [
  "https://download.thehive-project.org/responders.json"
]

# =========================================================
# STORAGE
# =========================================================

datastore.name = cortex

# =========================================================
# AUTHENTICATION
# =========================================================

auth {
  provider = local
}

# =========================================================
# ELASTICSEARCH
# =========================================================

search {
  uri = "http://elasticsearch:9200"
  index = cortex
}

# =========================================================
# LOGGING
# =========================================================

logger.application = INFO
logger.play = INFO

# =========================================================
# JOBS
# =========================================================

jobs {
  workers = 2
}

# =========================================================
# MAX JOBS
# =========================================================

job {
  timeout = 10 minutes
}

# =========================================================
# CACHE
# =========================================================

cache {
  provider = caffeine
}

# =========================================================
# CORS
# =========================================================

play.filters.enabled += "play.filters.cors.CORSFilter"

play.filters.cors {
  allowedOrigins = ["*"]
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE"]
  allowedHttpHeaders = ["Authorization", "Content-Type"]
}

# =========================================================
# SECURITY
# =========================================================

security {
  password {
    minLength = 8
  }
}

# =========================================================
# FILES
# =========================================================

maxFileSize = 100MB

# =========================================================
# TIMEZONE
# =========================================================

timezone = "Africa/Casablanca"