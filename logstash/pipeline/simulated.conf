# =========================================================
# SIMULATED ATTACK LOG PIPELINE
# SOC-IAC PLATFORM
# =========================================================

input {

  file {

    path => "/var/log/simulated_logs/*.json"

    start_position => "beginning"

    sincedb_path => "/dev/null"

    codec => json

    type => "simulated-attack"

    mode => "tail"

  }

}

filter {

  # =======================================================
  # TIMESTAMP
  # =======================================================

  if [timestamp] {

    date {

      match => [ "timestamp", "ISO8601" ]

      target => "@timestamp"

    }

  }

  # =======================================================
  # EVENT MODULE
  # =======================================================

  mutate {

    add_field => {

      "[event][module]" => "soc-simulation"
      "[event][dataset]" => "simulated.attack"

    }

  }

  # =======================================================
  # ECS MAPPING
  # =======================================================

  mutate {

    rename => {
      "src_ip" => "[source][ip]"
      "src_port" => "[source][port]"

      "dest_ip" => "[destination][ip]"
      "dest_port" => "[destination][port]"
    }

  }

  # =======================================================
  # GEOIP ENRICHMENT
  # =======================================================

  if [source][ip] {

    geoip {

      source => "[source][ip]"

      target => "[source][geo]"

    }

  }

  # =======================================================
  # ATTACK TYPE TAGGING
  # =======================================================

  if [event_type] == "port_scan" {

    mutate {

      add_tag => [ "port_scan_detected" ]
      add_tag => [ "network_attack" ]

    }

    mutate {
      add_field => {
        "[event][severity]" => "medium"
      }
    }

  }

  # =======================================================
  # SSH BRUTEFORCE
  # =======================================================

  if [event_type] == "ssh_bruteforce" {

    mutate {

      add_tag => [ "ssh_bruteforce_detected" ]
      add_tag => [ "credential_attack" ]

    }

    mutate {
      add_field => {
        "[event][severity]" => "high"
      }
    }

  }

  # =======================================================
  # REVERSE SHELL
  # =======================================================

  if [event_type] == "reverse_shell" {

    mutate {

      add_tag => [ "reverse_shell_detected" ]
      add_tag => [ "critical_attack" ]

    }

    mutate {
      add_field => {
        "[event][severity]" => "critical"
      }
    }

  }

  # =======================================================
  # DNS TUNNEL
  # =======================================================

  if [event_type] == "dns_tunnel" {

    mutate {

      add_tag => [ "dns_tunnel_detected" ]
      add_tag => [ "exfiltration_attempt" ]

    }

    mutate {
      add_field => {
        "[event][severity]" => "high"
      }
    }

  }

  # =======================================================
  # MALWARE DOWNLOAD
  # =======================================================

  if [event_type] == "malware_download" {

    mutate {

      add_tag => [ "malware_activity" ]
      add_tag => [ "file_download" ]

    }

    mutate {
      add_field => {
        "[event][severity]" => "critical"
      }
    }

  }

  # =======================================================
  # BEACONING
  # =======================================================

  if [event_type] == "beaconing" {

    mutate {

      add_tag => [ "beaconing_detected" ]
      add_tag => [ "c2_activity" ]

    }

    mutate {
      add_field => {
        "[event][severity]" => "high"
      }
    }

  }

  # =======================================================
  # MITRE ATT&CK MAPPING
  # =======================================================

  if [mitre] {

    mutate {

      add_field => {
        "[threat][framework]" => "MITRE ATT&CK"
      }

    }

  }

  # =======================================================
  # RISK SCORE
  # =======================================================

  if [event][severity] == "critical" {

    mutate {
      add_field => {
        "[event][risk_score]" => "90"
      }
    }

  }

  else if [event][severity] == "high" {

    mutate {
      add_field => {
        "[event][risk_score]" => "70"
      }
    }

  }

  else if [event][severity] == "medium" {

    mutate {
      add_field => {
        "[event][risk_score]" => "50"
      }
    }

  }

  # =======================================================
  # DEFAULT VALUES
  # =======================================================

  if ![event][severity] {

    mutate {
      add_field => {
        "[event][severity]" => "low"
      }
    }

  }

  # =======================================================
  # CLEANUP
  # =======================================================

  mutate {

    remove_field => [
      "host",
      "path",
      "@version"
    ]

  }

}

output {

  # =======================================================
  # ELASTICSEARCH
  # =======================================================

  elasticsearch {

    hosts => ["http://elasticsearch:9200"]

    index => "soc-simulated-%{+YYYY.MM.dd}"

  }

  # =======================================================
  # DEBUG OUTPUT
  # =======================================================

  stdout {

    codec => rubydebug

  }

}