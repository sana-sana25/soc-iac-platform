# =========================================================
# LINUX AUTH LOG PIPELINE
# SOC-IAC PLATFORM
# =========================================================

input {

  file {

    path => "/var/log/auth.log"

    start_position => "beginning"

    sincedb_path => "/dev/null"

    type => "linux-auth"

    mode => "tail"

  }

}

filter {

  # =======================================================
  # GROK PARSING
  # =======================================================

  grok {

    match => {

      "message" => [

        "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} sshd(?:\\[%{NUMBER:pid}\\])?: Failed password for %{WORD:user} from %{IP:src_ip} port %{NUMBER:src_port} ssh2",

        "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} sshd(?:\\[%{NUMBER:pid}\\])?: Accepted password for %{WORD:user} from %{IP:src_ip} port %{NUMBER:src_port} ssh2",

        "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} sudo: %{WORD:user} : TTY=%{DATA:tty} ; PWD=%{DATA:pwd} ; USER=%{WORD:target_user} ; COMMAND=%{GREEDYDATA:command}"

      ]

    }

  }

  # =======================================================
  # DATE
  # =======================================================

  date {

    match => [ "timestamp", "MMM dd HH:mm:ss" ]

    target => "@timestamp"

  }

  # =======================================================
  # EVENT DATASET
  # =======================================================

  mutate {

    add_field => {

      "[event][dataset]" => "linux.auth"
      "[event][module]" => "system"

    }

  }

  # =======================================================
  # SSH BRUTEFORCE DETECTION
  # =======================================================

  if "Failed password" in [message] {

    mutate {

      add_tag => [ "ssh_failed_login" ]
      add_tag => [ "possible_bruteforce" ]

    }

    mutate {
      add_field => {
        "[event][severity]" => "high"
      }
    }

  }

  # =======================================================
  # SUCCESSFUL SSH LOGIN
  # =======================================================

  if "Accepted password" in [message] {

    mutate {

      add_tag => [ "ssh_success_login" ]

    }

    mutate {
      add_field => {
        "[event][severity]" => "medium"
      }
    }

  }

  # =======================================================
  # ROOT LOGIN DETECTION
  # =======================================================

  if [user] == "root" {

    mutate {

      add_tag => [ "root_login_detected" ]

    }

    mutate {
      add_field => {
        "[event][severity]" => "critical"
      }
    }

  }

  # =======================================================
  # SUDO COMMAND DETECTION
  # =======================================================

  if "sudo" in [message] {

    mutate {

      add_tag => [ "sudo_activity" ]

    }

  }

  # =======================================================
  # SUSPICIOUS COMMAND DETECTION
  # =======================================================

  if [command] {

    if [command] =~ /wget|curl|nc|netcat|bash|python|chmod/ {

      mutate {

        add_tag => [ "suspicious_command" ]

      }

      mutate {
        add_field => {
          "[event][severity]" => "critical"
        }
      }

    }

  }

  # =======================================================
  # GEOIP
  # =======================================================

  if [src_ip] {

    geoip {

      source => "src_ip"

      target => "[source][geo]"

    }

  }

  # =======================================================
  # ECS FIELD MAPPING
  # =======================================================

  mutate {

    rename => {
      "src_ip" => "[source][ip]"
      "src_port" => "[source][port]"
    }

  }

  # =======================================================
  # CLEANUP
  # =======================================================

  mutate {

    remove_field => [
      "host",
      "@version",
      "path"
    ]

  }

}

output {

  # =======================================================
  # ELASTICSEARCH
  # =======================================================

  elasticsearch {

    hosts => ["http://elasticsearch:9200"]

    index => "linux-auth-%{+YYYY.MM.dd}"

  }

  # =======================================================
  # DEBUG
  # =======================================================

  stdout {

    codec => rubydebug

  }

}