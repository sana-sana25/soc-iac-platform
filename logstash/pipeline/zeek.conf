# =========================================================
# ZEEK LOG PIPELINE
# SOC-IAC PLATFORM
# =========================================================

input {

  file {
    path => "/var/log/zeek/*.log"

    start_position => "beginning"

    sincedb_path => "/dev/null"

    codec => json

    type => "zeek"

    mode => "read"
  }

}

filter {

  # =======================================================
  # TIMESTAMP
  # =======================================================

  if [ts] {
    date {
      match => [ "ts", "UNIX" ]
      target => "@timestamp"
    }
  }

  # =======================================================
  # SOURCE / DESTINATION MAPPING
  # =======================================================

  mutate {

    rename => {
      "id.orig_h" => "[source][ip]"
      "id.orig_p" => "[source][port]"

      "id.resp_h" => "[destination][ip]"
      "id.resp_p" => "[destination][port]"
    }

  }

  # =======================================================
  # NETWORK PROTOCOL
  # =======================================================

  mutate {
    rename => {
      "proto" => "[network][transport]"
    }
  }

  # =======================================================
  # EVENT DATASET
  # =======================================================

  mutate {
    add_field => {
      "[event][dataset]" => "zeek"
      "[event][module]" => "network"
    }
  }

  # =======================================================
  # GEOIP ENRICHMENT
  # =======================================================

  if [source][ip] {

    geoip {
      source => "[source][ip]"
      target => "[source][geo]"
    }

  }

  # =======================================================
  # PORT SCAN DETECTION TAG
  # =======================================================

  if [destination][port] {

    if [destination][port] > 1000 {

      mutate {
        add_tag => [ "suspicious_port_activity" ]
      }

    }

  }

  # =======================================================
  # DNS TUNNEL DETECTION
  # =======================================================

  if [query] {

    ruby {

      code => '
        query = event.get("query")
        if query and query.length > 50
          event.tag("possible_dns_tunnel")
        end
      '

    }

  }

  # =======================================================
  # REVERSE SHELL DETECTION
  # =======================================================

  if [destination][port] == 4444 or
     [destination][port] == 5555 or
     [destination][port] == 1337 {

    mutate {
      add_tag => [ "possible_reverse_shell" ]
    }

  }

  # =======================================================
  # CONNECTION DURATION
  # =======================================================

  if [duration] {

    ruby {

      code => '
        duration = event.get("duration")
        if duration and duration.to_f > 300
          event.tag("long_connection")
        end
      '

    }

  }

  # =======================================================
  # CLEANUP
  # =======================================================

  mutate {
    remove_field => [
      "host",
      "path",
      "@version"
    ]
  }

}

output {

  # =======================================================
  # ELASTICSEARCH OUTPUT
  # =======================================================

  elasticsearch {

    hosts => ["http://elasticsearch:9200"]

    index => "zeek-%{+YYYY.MM.dd}"

  }

  # =======================================================
  # DEBUG OUTPUT
  # =======================================================

  stdout {
    codec => rubydebug
  }

}