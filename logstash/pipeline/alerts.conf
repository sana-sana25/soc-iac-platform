# =========================================================
# ALERT PROCESSING PIPELINE
# SOC-IAC PLATFORM
# =========================================================

input {

  elasticsearch {

    hosts => ["http://elasticsearch:9200"]

    index => "soc-simulated-*"

    schedule => "* * * * *"

    query => '
    {
      "query": {
        "bool": {
          "should": [
            { "match": { "event.severity": "high" }},
            { "match": { "event.severity": "critical" }}
          ]
        }
      }
    }
    '

  }

}

filter {

  # =======================================================
  # ALERT TAGGING
  # =======================================================

  mutate {

    add_tag => [ "soc_alert" ]

  }

  # =======================================================
  # ALERT TITLE
  # =======================================================

  if [event_type] {

    mutate {

      add_field => {
        "[alert][title]" => "%{event_type} detected"
      }

    }

  }

  # =======================================================
  # ALERT DESCRIPTION
  # =======================================================

  mutate {

    add_field => {

      "[alert][description]" => "SOC alert generated from simulated attack pipeline."

    }

  }

  # =======================================================
  # ALERT SEVERITY
  # =======================================================

  if [event][severity] == "critical" {

    mutate {
      add_field => {
        "[alert][priority]" => "P1"
      }
    }

  }

  else if [event][severity] == "high" {

    mutate {
      add_field => {
        "[alert][priority]" => "P2"
      }
    }

  }

  else {

    mutate {
      add_field => {
        "[alert][priority]" => "P3"
      }
    }

  }

  # =======================================================
  # MITRE FRAMEWORK
  # =======================================================

  if [mitre] {

    mutate {

      add_field => {
        "[threat][framework]" => "MITRE ATT&CK"
      }

    }

  }

  # =======================================================
  # ADD SOC METADATA
  # =======================================================

  mutate {

    add_field => {

      "[soc][platform]" => "SOC-IAC"
      "[soc][environment]" => "local-lab"

    }

  }

  # =======================================================
  # ALERT TIMESTAMP
  # =======================================================

  ruby {

    code => '
      event.set("[alert][generated_at]", Time.now.utc.iso8601)
    '

  }

}

output {

  # =======================================================
  # ELASTICSEARCH ALERT INDEX
  # =======================================================

  elasticsearch {

    hosts => ["http://elasticsearch:9200"]

    index => "soc-alerts-%{+YYYY.MM.dd}"

  }

  # =======================================================
  # DEBUG OUTPUT
  # =======================================================

  stdout {

    codec => rubydebug

  }

}